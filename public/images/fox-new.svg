<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Fur Gradients -->
    <linearGradient id="whiteFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e3e8ee" />
      <stop offset="100%" stop-color="#b8c2cc" />
    </linearGradient>

    <linearGradient id="shadowFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4ced8" />
      <stop offset="100%" stop-color="#8f9ba8" />
    </linearGradient>

    <linearGradient id="blueGreyFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#96adc2" />
      <stop offset="50%" stop-color="#698196" />
      <stop offset="100%" stop-color="#435566" />
    </linearGradient>

    <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8dfd8" />
      <stop offset="100%" stop-color="#9ca6b0" />
    </linearGradient>

    <!-- Eye Gradient (Blue top, Amber bottom) -->
    <linearGradient id="eyeIris" x1="0%" y1="15%" x2="0%" y2="95%">
      <stop offset="0%" stop-color="#0d3b78" />
      <stop offset="45%" stop-color="#2980b9" />
      <stop offset="75%" stop-color="#e69c24" />
      <stop offset="100%" stop-color="#f3c65f" />
    </linearGradient>

    <!-- Soft drop shadow for layered depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f2933" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= TAIL ================= -->
  <g id="tail" class="tail" filter="url(#dropShadow)">
    <path d="M 380 430 
             Q 430 350 475 370 
             L 460 385 
             Q 500 385 515 405 
             L 490 420 
             Q 525 430 530 455 
             L 495 465 
             Q 515 480 500 495 
             Q 450 505 405 470 Z" fill="url(#whiteFur)" />
    <path d="M 390 440 Q 440 390 480 410 Q 450 445 405 465 Z" fill="url(#shadowFur)" opacity="0.6" />
  </g>

  <!-- ================= BACK LEGS & BODY ================= -->
  <g id="hindquarters" class="body">
    <!-- Back Left Leg (viewer's right) -->
    <path d="M 370 410 Q 425 430 430 490 L 445 520 Q 420 530 395 520 L 385 465 Q 360 450 370 410 Z" fill="url(#shadowFur)" />
    <!-- Back Left Paw -->
    <ellipse cx="418" cy="520" rx="24" ry="12" fill="url(#whiteFur)" />
    <path d="M 408 514 L 408 525 M 420 513 L 420 526 M 431 515 L 431 524" stroke="#8f9ba8" stroke-width="2" stroke-linecap="round" />

    <!-- Lower Torso -->
    <path d="M 250 380 Q 330 400 405 430 Q 400 475 335 465 Q 270 460 250 380 Z" fill="url(#shadowFur)" />
  </g>

  <!-- ================= FRONT LEGS ================= -->
  <g id="front-legs">
    <!-- Front Right Leg (viewer's left) -->
    <path d="M 248 400 L 256 525 L 302 525 L 306 415 Z" fill="url(#whiteFur)" />
    <!-- Front Left Leg (viewer's right) -->
    <path d="M 315 415 L 312 528 L 362 528 L 372 400 Z" fill="url(#whiteFur)" />

    <!-- Front Right Paw -->
    <path d="M 248 525 Q 248 506 276 506 Q 304 506 304 525 Q 304 533 276 533 Q 248 533 248 525 Z" fill="url(#whiteFur)" filter="url(#dropShadow)" />
    <path d="M 263 513 L 263 530 M 276 511 L 276 531 M 289 513 L 289 530" stroke="#9aa5b1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Front Left Paw -->
    <path d="M 306 528 Q 306 508 336 508 Q 366 508 366 528 Q 366 536 336 536 Q 306 536 306 528 Z" fill="url(#whiteFur)" filter="url(#dropShadow)" />
    <path d="M 322 515 L 322 533 M 336 513 L 336 534 M 350 515 L 350 533" stroke="#9aa5b1" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- ================= CHEST RUFF ================= -->
  <g id="chest-ruff" filter="url(#dropShadow)">
    <!-- Lower Layer -->
    <path d="M 235 350 
             L 218 380 L 242 385 
             L 235 415 L 265 410 
             L 280 445 L 305 425 
             L 320 455 L 350 420 
             L 375 435 L 380 400 
             L 405 405 L 390 370 
             L 410 360 L 385 335 Z" fill="url(#shadowFur)" />
    <!-- Upper Layer -->
    <path d="M 230 330 
             L 210 355 L 238 362 
             L 228 390 L 262 385 
             L 268 415 L 298 398 
             L 315 430 L 342 395 
             L 368 410 L 372 375 
             L 398 378 L 382 340 Z" fill="url(#whiteFur)" />
    <!-- Blue-Grey Accents on Ruff -->
    <path d="M 340 340 L 355 385 L 375 370 L 395 385 L 385 345 Z" fill="url(#blueGreyFur)" opacity="0.85" />
  </g>

  <!-- ================= HEAD & EARS ================= -->
  <g id="head" class="head" filter="url(#dropShadow)">
    <!-- Left Ear (viewer's left) -->
    <path d="M 215 220 Q 190 120 225 65 Q 285 105 310 175 Z" fill="url(#whiteFur)" />
    <path d="M 225 205 Q 208 130 230 85 Q 275 120 292 175 Z" fill="url(#earInner)" />
    <path d="M 218 190 L 200 165 L 225 168 L 215 145 L 245 160 L 260 195 Z" fill="url(#whiteFur)" />

    <!-- Right Ear (viewer's right) -->
    <path d="M 335 180 Q 375 100 420 55 Q 450 130 415 235 Z" fill="url(#whiteFur)" />
    <path d="M 350 185 Q 380 120 412 80 Q 430 140 402 220 Z" fill="url(#earInner)" />
    <!-- Dark inner ear tufts -->
    <path d="M 365 180 L 405 140 L 390 165 L 415 165 L 385 205 Z" fill="#364554" />
    <path d="M 355 200 L 395 175 L 385 198 L 412 202 L 380 225 Z" fill="url(#blueGreyFur)" />

    <!-- Base Head & Cheek Fur (White) -->
    <path d="M 215 205 
             L 185 225 L 205 240 
             L 175 268 L 202 278 
             L 180 305 L 212 312 
             Q 245 355 300 350 
             Q 355 350 390 325 
             L 430 330 L 408 302 
             L 442 292 L 415 268 
             L 440 245 L 412 230 
             Z" fill="url(#whiteFur)" />

    <!-- Blue-Grey Crown & Cheek Spikes -->
    <path d="M 275 150 
             L 265 125 L 295 142 
             L 315 115 L 330 142 
             L 365 122 L 360 155 
             L 395 150 L 380 180 
             L 420 185 L 395 210 
             L 435 225 L 405 245 
             L 438 268 L 400 278 
             L 422 308 L 380 305 
             L 385 330 L 350 305 
             Q 375 255 345 215 
             Q 320 195 295 205 
             L 275 230 L 265 195 
             L 230 215 L 245 185 
             L 215 185 L 250 165 
             Z" fill="url(#blueGreyFur)" />

    <!-- Lighter Blue-Grey Forehead Overlapping Tuft -->
    <path d="M 250 175 
             L 230 165 L 265 155 
             L 285 135 L 302 158 
             L 335 140 L 330 170 
             L 368 165 L 348 192 
             L 382 202 L 345 212 
             L 325 195 L 305 220 
             L 292 192 L 268 222 
             L 265 190 L 235 202 
             Z" fill="#8aa2b8" />

    <!-- ================= EYES ================= -->
    <!-- Left Eye (viewer's left) -->
    <g id="left-eye" class="eyes">
      <!-- Eyeliner / Socket -->
      <path d="M 210 262 Q 215 225 238 228 Q 258 232 252 270 Q 245 292 225 286 Q 208 280 210 262 Z" fill="#182026" />
      <!-- Iris -->
      <ellipse cx="233" cy="258" rx="17" ry="24" fill="url(#eyeIris)" />
      <!-- Pupil -->
      <ellipse cx="235" cy="256" rx="10" ry="15" fill="#0b1116" />
      <!-- Catchlights -->
      <circle cx="228" cy="244" r="6" fill="#ffffff" opacity="0.95" />
      <circle cx="241" cy="268" r="3" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Right Eye (viewer's right) -->
    <g id="right-eye" class="eyes">
      <!-- Eyeliner / Wing -->
      <path d="M 295 268 Q 302 222 336 226 Q 368 230 368 265 L 378 260 Q 370 280 355 290 Q 330 302 308 290 Q 295 280 295 268 Z" fill="#182026" />
      <!-- Iris -->
      <ellipse cx="332" cy="260" rx="24" ry="26" fill="url(#eyeIris)" />
      <!-- Pupil -->
      <ellipse cx="330" cy="258" rx="14" ry="16" fill="#0b1116" />
      <!-- Catchlights -->
      <ellipse cx="322" cy="245" rx="7" ry="5.5" transform="rotate(-20 322 245)" fill="#ffffff" opacity="0.95" />
      <circle cx="342" cy="272" r="3.5" fill="#ffffff" opacity="0.8" />
      <path d="M 315 272 Q 330 282 345 272" fill="none" stroke="#ffd875" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- Eyebrows -->
    <path d="M 218 215 Q 232 205 248 216" fill="none" stroke="#2c3a47" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 312 212 Q 335 202 356 218" fill="none" stroke="#2c3a47" stroke-width="4" stroke-linecap="round" />

    <!-- Under-eye Light Fur Mark -->
    <path d="M 305 298 Q 328 308 350 298 Q 345 306 325 306 Z" fill="#d9ecff" opacity="0.8" />

    <!-- ================= SNOUT & MOUTH ================= -->
    <g id="snout">
      <!-- Snout Bridge & Muzzle Volume -->
      <path d="M 222 275 
               Q 200 288 205 312 
               Q 212 332 245 335 
               Q 278 338 308 320 
               Q 300 282 260 272 Z" fill="url(#whiteFur)" />

      <!-- Open Mouth / Tongue -->
      <path d="M 225 322 Q 242 342 268 334 Q 252 325 225 322 Z" fill="#3b1d24" />
      <path d="M 234 328 Q 246 336 258 331 Q 248 325 234 328 Z" fill="#d96b70" />

      <!-- Smile Line -->
      <path d="M 216 316 Q 245 335 278 332 Q 298 330 312 316" fill="none" stroke="#25303b" stroke-width="3" stroke-linecap="round" />

      <!-- Nose -->
      <path d="M 214 286 
               Q 226 280 240 286 
               Q 246 294 236 304 
               Q 225 314 216 304 
               Q 208 294 214 286 Z" fill="#14191f" />
      <!-- Nose Highlight -->
      <ellipse cx="224" cy="290" rx="7" ry="3.5" transform="rotate(-10 224 290)" fill="#5c6b7a" opacity="0.7" />

      <!-- Whisker Spots -->
      <circle cx="255" cy="312" r="1.5" fill="#7c8b99" />
      <circle cx="264" cy="315" r="1.5" fill="#7c8b99" />
      <circle cx="259" cy="320" r="1.5" fill="#7c8b99" />
      <circle cx="270" cy="319" r="1.5" fill="#7c8b99" />
    </g>
  </g>
</svg>