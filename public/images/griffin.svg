<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="griffin">
    <!-- Lion tail with tuft -->
    <g class="tail">
      <path d="M 66 80 Q 90 84 90 62" stroke="#c98a3d" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <ellipse cx="90" cy="58" rx="5.5" ry="7.5" fill="#8b5a2b" />
    </g>
    <!-- Big eagle wings -->
    <path class="wing-left" d="M 36 56 Q 2 52 6 20 Q 16 34 24 38 Q 16 24 20 8 Q 34 22 40 46 Z" fill="#a16207" />
    <path class="wing-right" d="M 64 56 Q 98 52 94 20 Q 84 34 76 38 Q 84 24 80 8 Q 66 22 60 46 Z" fill="#a16207" />
    <path d="M 36 54 Q 16 50 14 30 Q 24 40 38 48 Z" fill="#fde68a" opacity="0.9" />
    <path d="M 64 54 Q 84 50 86 30 Q 76 40 62 48 Z" fill="#fde68a" opacity="0.9" />
    <!-- Eagle talons -->
    <path d="M 34 90 L 34 94 M 38 90 L 38 95 M 42 90 L 42 94 M 58 90 L 58 94 M 62 90 L 62 95 M 66 90 L 66 94" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" />
    <!-- Lion body -->
    <ellipse class="body" cx="50" cy="72" rx="21" ry="19" fill="#e0a458" />
    <ellipse cx="50" cy="76" rx="12" ry="12" fill="#fde7b0" />
    <ellipse cx="38" cy="88" rx="7" ry="4.5" fill="#f5c46b" />
    <ellipse cx="62" cy="88" rx="7" ry="4.5" fill="#f5c46b" />
    <!-- Eagle head -->
    <g class="head">
      <path class="ear-left" d="M 32 30 Q 28 16 38 12 Q 38 22 42 28 Z" fill="#a16207" />
      <path class="ear-right" d="M 68 30 Q 72 16 62 12 Q 62 22 58 28 Z" fill="#a16207" />
      <circle cx="50" cy="42" r="21" fill="#fff7ed" />
      <path d="M 32 48 Q 28 58 36 62 Q 34 54 38 50 Z" fill="#e8d9c0" />
      <path d="M 68 48 Q 72 58 64 62 Q 66 54 62 50 Z" fill="#e8d9c0" />
      <g class="eyes">
        <circle cx="41" cy="40" r="4" fill="#f59e0b" />
        <circle cx="59" cy="40" r="4" fill="#f59e0b" />
        <circle cx="41" cy="40" r="2.2" fill="#1c1917" />
        <circle cx="59" cy="40" r="2.2" fill="#1c1917" />
        <circle cx="42" cy="39" r="0.9" fill="#ffffff" />
        <circle cx="60" cy="39" r="0.9" fill="#ffffff" />
      </g>
      <!-- Beak -->
      <path class="nose" d="M 42 48 Q 50 44 58 48 Q 54 60 50 62 Q 46 60 42 48 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1" stroke-linejoin="round" />
      <path d="M 44 52 Q 50 55 56 52" stroke="#b45309" stroke-width="1" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
