<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="baby-penguin">
    <!-- Short legs and webbed feet, tucked right under the body -->
    <g class="leg-left">
      <rect x="34" y="84" width="8" height="9" rx="3" fill="#e8920c" />
      <path class="foot-left" d="M 27 97 Q 28 90 38 90 Q 48 90 49 97 Q 44 101 38 98 Q 32 101 27 97 Z" fill="#fca311" stroke="#e8920c" stroke-width="1" stroke-linejoin="round" />
    </g>
    <g class="leg-right">
      <rect x="58" y="84" width="8" height="9" rx="3" fill="#e8920c" />
      <path class="foot-right" d="M 51 97 Q 52 90 62 90 Q 72 90 73 97 Q 68 101 62 98 Q 56 101 51 97 Z" fill="#fca311" stroke="#e8920c" stroke-width="1" stroke-linejoin="round" />
    </g>

    <!-- Body -->
    <ellipse class="body-black" cx="50" cy="60" rx="25" ry="30" fill="#14213d" />
    <ellipse class="body-white" cx="50" cy="65" rx="18" ry="22" fill="#ffffff" />
    
    <!-- Flippers -->
    <path class="flipper-left" d="M 25 55 Q 10 70 20 80" stroke="#14213d" stroke-width="8" stroke-linecap="round" fill="none" />
    <path class="flipper-right" d="M 75 55 Q 90 70 80 80" stroke="#14213d" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Head -->
    <g class="head">
      <circle cx="50" cy="35" r="20" fill="#14213d" />
      <circle class="face-patch-left" cx="42" cy="38" r="10" fill="#ffffff" />
      <circle class="face-patch-right" cx="58" cy="38" r="10" fill="#ffffff" />
      
      <!-- Eyes & Beak -->
      <g class="eyes">
        <circle cx="42" cy="37" r="3" fill="#111111" />
        <circle cx="58" cy="37" r="3" fill="#111111" />
      </g>
      <polygon class="beak" points="45,43 55,43 50,50" fill="#fca311" />
    </g>
  </g>
</svg>