<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="ghost">
    <!-- Wispy tail -->
    <path class="tail" d="M 70 80 Q 90 84 92 68 Q 82 74 72 72 Z" fill="#e0f2fe" opacity="0.85" />
    <!-- Sheet body with wavy hem -->
    <path class="body" d="M 22 94 L 22 52 Q 22 16 50 16 Q 78 16 78 52 L 78 94 Q 71 86 64 94 Q 57 86 50 94 Q 43 86 36 94 Q 29 86 22 94 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" />
    <path d="M 28 60 Q 28 80 34 86" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Little arms -->
    <ellipse cx="20" cy="66" rx="6" ry="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
    <ellipse cx="80" cy="66" rx="6" ry="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
    <!-- Face -->
    <g class="head">
      <g class="eyes">
        <ellipse cx="40" cy="48" rx="4.5" ry="6" fill="#0f172a" />
        <ellipse cx="60" cy="48" rx="4.5" ry="6" fill="#0f172a" />
        <circle cx="41.5" cy="46" r="1.6" fill="#ffffff" />
        <circle cx="61.5" cy="46" r="1.6" fill="#ffffff" />
      </g>
      <ellipse class="mouth" cx="50" cy="62" rx="4" ry="5" fill="#0f172a" />
      <circle cx="33" cy="58" r="4" fill="#fda4af" opacity="0.6" />
      <circle cx="67" cy="58" r="4" fill="#fda4af" opacity="0.6" />
    </g>
  </g>
</svg>
