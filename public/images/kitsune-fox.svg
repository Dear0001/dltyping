<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="100%">
  <defs>
    <!-- White Fur & Porcelain Shading Gradients -->
    <radialGradient id="headGrad" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f5f5f7" />
      <stop offset="100%" stop-color="#d9d8de" />
    </radialGradient>

    <linearGradient id="whiteFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f2f1f5" />
      <stop offset="100%" stop-color="#d5d4dc" />
    </linearGradient>

    <linearGradient id="tailBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ededf2" />
      <stop offset="100%" stop-color="#cac9d4" />
    </linearGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3" />
      <stop offset="35%" stop-color="#f5bd42" />
      <stop offset="75%" stop-color="#d48c19" />
      <stop offset="100%" stop-color="#9c5c06" />
    </linearGradient>

    <linearGradient id="earInsideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d68918" />
      <stop offset="50%" stop-color="#edaa3b" />
      <stop offset="100%" stop-color="#fce092" />
    </linearGradient>

    <radialGradient id="bellGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff7cc" />
      <stop offset="45%" stop-color="#f5bc38" />
      <stop offset="85%" stop-color="#c47a0e" />
      <stop offset="100%" stop-color="#8a4d04" />
    </radialGradient>

    <!-- Dark Brown/Black Glossy Eye Gradient -->
    <radialGradient id="eyeGrad" cx="50%" cy="55%" r="50%">
      <stop offset="30%" stop-color="#0d0806" />
      <stop offset="75%" stop-color="#2e1d14" />
      <stop offset="100%" stop-color="#080403" />
    </radialGradient>

    <!-- Soft Pink Blush -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9999" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ff9999" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff9999" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ================= NINE TAILS ================= -->
  <g id="nine-tails" class="tail">
    <!-- 1. Center Top Tail -->
    <g id="tail-center">
      <path d="M 335 240 C 315 150, 365 80, 392 15 C 425 80, 475 150, 465 240 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <!-- Gold Flame Tip -->
      <path d="M 392 15 C 412 55, 425 85, 435 120 C 422 115, 415 125, 410 145 C 400 120, 385 115, 378 135 C 365 115, 365 95, 355 110 C 365 75, 380 45, 392 15 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 2. Upper Left Tail -->
    <g id="tail-upper-left">
      <path d="M 280 355 C 175 305, 115 235, 92 145 C 185 165, 260 225, 315 310 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <path d="M 92 145 C 135 155, 165 170, 190 190 C 170 195, 165 208, 175 222 C 150 212, 138 220, 145 238 C 122 225, 108 190, 92 145 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 3. Upper Right Tail -->
    <g id="tail-upper-right">
      <path d="M 520 355 C 625 305, 685 235, 708 145 C 615 165, 540 225, 485 310 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <path d="M 708 145 C 665 155, 635 170, 610 190 C 630 195, 635 208, 625 222 C 650 212, 662 220, 655 238 C 678 225, 692 190, 708 145 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 4. Mid-Upper Left Tail -->
    <g id="tail-mid-upper-left">
      <path d="M 270 455 C 145 435, 65 365, 35 280 C 130 285, 225 330, 290 405 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <path d="M 35 280 C 80 282, 115 295, 142 312 C 122 318, 118 332, 132 345 C 105 340, 95 350, 105 368 C 75 352, 52 320, 35 280 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 5. Mid-Upper Right Tail -->
    <g id="tail-mid-upper-right">
      <path d="M 530 455 C 655 435, 735 365, 765 280 C 670 285, 575 330, 510 405 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <path d="M 765 280 C 720 282, 685 295, 658 312 C 678 318, 682 332, 668 345 C 695 340, 705 350, 695 368 C 725 352, 748 320, 765 280 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 6. Mid-Lower Left Tail -->
    <g id="tail-mid-lower-left">
      <path d="M 290 555 C 165 565, 65 515, 18 445 C 115 415, 225 435, 300 500 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <path d="M 18 445 C 62 435, 98 438, 128 450 C 108 460, 108 475, 125 485 C 98 488, 92 500, 108 515 C 72 508, 42 480, 18 445 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 7. Mid-Lower Right Tail -->
    <g id="tail-mid-lower-right">
      <path d="M 510 555 C 635 565, 735 515, 782 445 C 685 415, 575 435, 500 500 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <path d="M 782 445 C 738 435, 702 438, 672 450 C 692 460, 692 475, 675 485 C 702 488, 708 500, 692 515 C 728 508, 758 480, 782 445 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 8. Bottom Left Tail -->
    <g id="tail-bottom-left">
      <path d="M 315 625 C 215 668, 115 645, 58 590 C 135 515, 245 505, 315 570 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <path d="M 58 590 C 98 565, 132 555, 165 558 C 148 572, 152 588, 172 595 C 148 605, 145 618, 165 630 C 128 632, 90 618, 58 590 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 9. Bottom Right Tail -->
    <g id="tail-bottom-right">
      <path d="M 485 625 C 585 668, 685 645, 742 590 C 665 515, 555 505, 485 570 Z" fill="url(#tailBodyGrad)" stroke="#c4c3cf" stroke-width="2" />
      <path d="M 742 590 C 702 565, 668 555, 635 558 C 652 572, 648 588, 628 595 C 652 605, 655 618, 635 630 C 672 632, 710 618, 742 590 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1.5" stroke-linejoin="round" />
    </g>
  </g>

  <!-- ================= SITTING BODY, LEGS & GOLD COLLAR ================= -->
  <g id="body" class="body">
    <!-- Hind Legs (Tucked at Sides) -->
    <!-- Left Hind Leg -->
    <path d="M 310 535 C 275 555, 275 615, 295 645 C 315 655, 335 650, 345 635 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="2" />
    <!-- Left Hind Anklet -->
    <path d="M 288 632 C 302 626, 322 628, 335 636 L 335 646 C 322 638, 302 636, 288 642 Z" fill="url(#goldGrad)" stroke="#9c5c06" stroke-width="1.5" />
    <!-- Left Hind Paw -->
    <path d="M 286 642 C 282 655, 288 668, 302 668 L 325 668 C 335 668, 338 655, 334 642 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="1.5" />
    <path d="M 302 652 L 302 668 M 316 652 L 316 668" stroke="#b8b7c4" stroke-width="2" stroke-linecap="round" />

    <!-- Right Hind Leg -->
    <path d="M 490 535 C 525 555, 525 615, 505 645 C 485 655, 465 650, 455 635 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="2" />
    <!-- Right Hind Anklet -->
    <path d="M 512 632 C 498 626, 478 628, 465 636 L 465 646 C 478 638, 498 636, 512 642 Z" fill="url(#goldGrad)" stroke="#9c5c06" stroke-width="1.5" />
    <!-- Right Hind Paw -->
    <path d="M 514 642 C 518 655, 512 668, 498 668 L 475 668 C 465 668, 462 655, 466 642 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="1.5" />
    <path d="M 498 652 L 498 668 M 484 652 L 484 668" stroke="#b8b7c4" stroke-width="2" stroke-linecap="round" />

    <!-- Central Torso Base -->
    <path d="M 320 480 C 305 535, 315 615, 345 645 L 455 645 C 485 615, 495 535, 480 480 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="2" />

    <!-- Front Legs -->
    <!-- Left Front Leg -->
    <path d="M 322 525 C 322 575, 330 620, 334 655 L 388 655 C 392 620, 392 580, 390 545 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="2" />
    <!-- Right Front Leg -->
    <path d="M 478 525 C 478 575, 470 620, 466 655 L 412 655 C 408 620, 408 580, 410 545 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="2" />

    <!-- Gold Shoulder Swirl Markings -->
    <path d="M 315 545 C 328 552, 328 578, 318 580 C 310 582, 310 568, 318 566" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 485 545 C 472 552, 472 578, 482 580 C 490 582, 490 568, 482 566" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Front Gold Anklets -->
    <path d="M 332 630 C 350 636, 372 636, 390 630 L 389 644 C 372 650, 350 650, 333 644 Z" fill="url(#goldGrad)" stroke="#9c5c06" stroke-width="1.5" />
    <path d="M 410 630 C 428 636, 450 636, 468 630 L 467 644 C 450 650, 428 650, 411 644 Z" fill="url(#goldGrad)" stroke="#9c5c06" stroke-width="1.5" />

    <!-- Front Paws & Toes -->
    <!-- Left Front Paw -->
    <path d="M 333 645 C 330 662, 338 675, 352 675 L 375 675 C 388 675, 392 662, 389 645 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="2" />
    <path d="M 352 656 L 352 675 M 370 656 L 370 675" stroke="#b8b7c4" stroke-width="2" stroke-linecap="round" />
    <!-- Right Front Paw -->
    <path d="M 411 645 C 408 662, 412 675, 425 675 L 448 675 C 462 675, 470 662, 467 645 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="2" />
    <path d="M 430 656 L 430 675 M 448 656 L 448 675" stroke="#b8b7c4" stroke-width="2" stroke-linecap="round" />

    <!-- Fluffy Chest Ruff -->
    <path d="M 325 480
             C 312 505, 315 530, 332 540
             C 332 558, 350 572, 368 575
             C 378 595, 392 608, 400 615
             C 408 608, 422 595, 432 575
             C 450 572, 468 558, 468 540
             C 485 530, 488 505, 475 480 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="2" stroke-linejoin="round" />

    <!-- Ornate Golden Collar & Bell -->
    <g id="collar">
      <!-- Decorative Filigree Loops on Chest -->
      <path d="M 332 482 C 325 512, 355 538, 375 520 C 382 512, 372 500, 364 508" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
      <path d="M 468 482 C 475 512, 445 538, 425 520 C 418 512, 428 500, 436 508" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
      <!-- Main Neck Ring -->
      <path d="M 355 478 C 378 498, 422 498, 445 478" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
      <!-- Golden Bell -->
      <circle cx="400" cy="522" r="18" fill="url(#bellGrad)" stroke="#8a4d04" stroke-width="1.5" />
      <path d="M 392 506 C 396 502, 404 502, 408 506" fill="none" stroke="#fff0b3" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- ================= EARS ================= -->
  <g id="ears">
    <!-- Left Ear -->
    <g id="left-ear" class="ear-left">
      <!-- Gold Outer & Inner Frame -->
      <path d="M 235 280 C 195 190, 200 95, 215 62 C 260 80, 315 135, 345 195 Z" fill="url(#goldGrad)" stroke="#9c5c06" stroke-width="2" stroke-linejoin="round" />
      <path d="M 242 268 C 210 190, 212 110, 222 80 C 260 98, 305 145, 332 195 Z" fill="url(#earInsideGrad)" />
      <!-- White Outer Ear Fur Trim -->
      <path d="M 290 120 C 315 145, 340 175, 355 205 L 315 215 C 305 175, 295 155, 280 142 C 288 135, 288 128, 290 120 Z" fill="url(#whiteFur)" stroke="#d5d4dc" stroke-width="1.5" />
      <!-- Fluffy White Inner Ear Tufts -->
      <path d="M 278 152 C 258 158, 248 170, 265 182 C 242 188, 232 202, 255 214 C 232 222, 230 238, 255 248 C 240 258, 242 272, 262 275 L 318 215 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Right Ear -->
    <g id="right-ear" class="ear-right">
      <!-- Gold Outer & Inner Frame -->
      <path d="M 565 280 C 605 190, 600 95, 585 62 C 540 80, 485 135, 455 195 Z" fill="url(#goldGrad)" stroke="#9c5c06" stroke-width="2" stroke-linejoin="round" />
      <path d="M 558 268 C 590 190, 588 110, 578 80 C 540 98, 495 145, 468 195 Z" fill="url(#earInsideGrad)" />
      <!-- White Outer Ear Fur Trim -->
      <path d="M 510 120 C 485 145, 460 175, 445 205 L 485 215 C 495 175, 505 155, 520 142 C 512 135, 512 128, 510 120 Z" fill="url(#whiteFur)" stroke="#d5d4dc" stroke-width="1.5" />
      <!-- Fluffy White Inner Ear Tufts -->
      <path d="M 522 152 C 542 158, 552 170, 535 182 C 558 188, 568 202, 545 214 C 568 222, 570 238, 545 248 C 560 258, 558 272, 538 275 L 482 215 Z" fill="url(#whiteFur)" stroke="#c4c3cf" stroke-width="1.5" stroke-linejoin="round" />
    </g>
  </g>

  <!-- ================= HEAD & FACIAL DETAILS ================= -->
  <g id="head" class="head">
    <!-- Main Chibi Fox Head Shape with Cheek Ruff Tufts -->
    <path d="M 400 175
             C 310 175, 245 235, 228 325
             C 220 322, 212 318, 205 312
             C 208 332, 215 348, 225 358
             C 212 356, 202 354, 195 348
             C 202 372, 218 392, 232 405
             C 222 406, 214 406, 208 402
             C 225 438, 285 482, 400 482
             C 515 482, 575 438, 592 402
             C 586 406, 578 406, 568 405
             C 582 392, 598 372, 605 348
             C 598 354, 588 356, 575 358
             C 585 348, 592 332, 595 312
             C 588 318, 580 322, 572 325
             C 555 235, 490 175, 400 175 Z" fill="url(#headGrad)" stroke="#c4c3cf" stroke-width="2" stroke-linejoin="round" />

    <!-- Top Crown Fur Tuft -->
    <path d="M 375 205 C 370 182, 380 165, 392 155 C 392 172, 396 178, 402 182 C 412 162, 428 148, 442 142 C 436 162, 434 175, 432 185 C 445 178, 455 175, 462 178 C 452 192, 442 202, 428 208 Z" fill="url(#whiteFur)" stroke="#d5d4dc" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Golden Forehead Flame / Swirl Mark -->
    <g id="forehead-mark">
      <path d="M 402 212
               C 406 238, 372 258, 372 292
               C 372 322, 398 332, 402 350
               C 405 335, 412 330, 424 322
               C 442 310, 446 282, 430 268
               C 415 255, 395 268, 398 286
               C 400 298, 416 298, 418 288
               C 412 292, 406 286, 408 278
               C 410 270, 422 270, 426 280
               C 432 292, 422 310, 406 310
               C 388 310, 384 288, 392 270
               C 400 252, 414 240, 402 212 Z" fill="url(#goldGrad)" stroke="#b37012" stroke-width="1" />
      <path d="M 418 242 C 428 248, 436 256, 438 265" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Golden Eyebrow Dots -->
    <ellipse cx="332" cy="306" rx="14" ry="5.5" transform="rotate(25 332 306)" fill="url(#goldGrad)" />
    <ellipse cx="468" cy="306" rx="14" ry="5.5" transform="rotate(-25 468 306)" fill="url(#goldGrad)" />

    <!-- Pink Rosy Cheeks -->
    <ellipse cx="275" cy="432" rx="24" ry="18" transform="rotate(15 275 432)" fill="url(#blushGrad)" />
    <ellipse cx="525" cy="432" rx="24" ry="18" transform="rotate(-15 525 432)" fill="url(#blushGrad)" />

    <!-- ================= EYES ================= -->
    <!-- Left Eye -->
    <g id="left-eye" class="eyes">
      <!-- Golden Outer Eye Accent -->
      <path d="M 268 368 C 266 385, 272 405, 286 416 C 278 398, 276 382, 278 368 Z" fill="url(#goldGrad)" />
      <!-- Dark Eyeliner & Winged Lashes -->
      <path d="M 262 355 C 268 362, 276 364, 284 358 C 302 338, 338 342, 352 372 C 362 395, 355 422, 335 428 C 305 434, 278 418, 276 385 C 272 378, 265 372, 260 365 C 266 365, 270 364, 272 362 C 266 360, 263 358, 262 355 Z" fill="#0d0806" />
      <!-- Glossy Iris/Pupil -->
      <ellipse cx="316" cy="388" rx="36" ry="37" fill="url(#eyeGrad)" />
      <!-- Subtle Warm Lower Reflection -->
      <path d="M 290 402 C 302 420, 332 420, 342 402 C 332 412, 302 412, 290 402 Z" fill="#6e4b3a" opacity="0.5" />
      <!-- Crisp White Catchlights -->
      <ellipse cx="326" cy="368" rx="11" ry="13" transform="rotate(-15 326 368)" fill="#ffffff" />
      <circle cx="298" cy="396" r="5" fill="#ffffff" />
    </g>

    <!-- Right Eye -->
    <g id="right-eye" class="eyes">
      <!-- Golden Outer Eye Accent -->
      <path d="M 532 368 C 534 385, 528 405, 514 416 C 522 398, 524 382, 522 368 Z" fill="url(#goldGrad)" />
      <!-- Dark Eyeliner & Winged Lashes -->
      <path d="M 538 355 C 532 362, 524 364, 516 358 C 498 338, 462 342, 448 372 C 438 395, 445 422, 465 428 C 495 434, 522 418, 524 385 C 528 378, 535 372, 540 365 C 534 365, 530 364, 528 362 C 534 360, 537 358, 538 355 Z" fill="#0d0806" />
      <!-- Glossy Iris/Pupil -->
      <ellipse cx="484" cy="388" rx="36" ry="37" fill="url(#eyeGrad)" />
      <!-- Subtle Warm Lower Reflection -->
      <path d="M 458 402 C 468 420, 498 420, 510 402 C 498 412, 468 412, 458 402 Z" fill="#6e4b3a" opacity="0.5" />
      <!-- Crisp White Catchlights -->
      <ellipse cx="494" cy="368" rx="11" ry="13" transform="rotate(-15 494 368)" fill="#ffffff" />
      <circle cx="466" cy="396" r="5" fill="#ffffff" />
    </g>

    <!-- ================= NOSE & MOUTH ================= -->
    <g id="muzzle">
      <!-- Little Black Button Nose -->
      <path d="M 390 422 C 390 417, 410 417, 410 422 C 410 428, 404 433, 400 433 C 396 433, 390 428, 390 422 Z" fill="#141010" />
      <ellipse cx="398" cy="421" rx="4" ry="1.5" fill="#ffffff" opacity="0.7" />
      <!-- Cute Cat/Fox ":3" Smile -->
      <path d="M 375 442 C 382 452, 396 450, 400 440 C 404 450, 418 452, 425 442" fill="none" stroke="#141010" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>