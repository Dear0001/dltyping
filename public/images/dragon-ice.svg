<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Body & Head Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf6ff" />
      <stop offset="60%" stop-color="#b5d6f0" />
      <stop offset="100%" stop-color="#7fa9d1" />
    </linearGradient>

    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4e7f7" />
    </linearGradient>

    <!-- Crystal & Ice Gradients -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aef2ff" />
      <stop offset="45%" stop-color="#289eff" />
      <stop offset="100%" stop-color="#0051b5" />
    </linearGradient>

    <linearGradient id="crystalLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#5ec8ff" />
    </linearGradient>

    <!-- Wing Membrane Gradient -->
    <linearGradient id="wingMembrane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c7ed6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4dabf7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a5d8ff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gold Wing Frame Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#d49b35" />
      <stop offset="100%" stop-color="#8c5811" />
    </linearGradient>

    <!-- Eye Gradient -->
    <radialGradient id="eyeIris" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#051937" />
      <stop offset="75%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#4dd2ff" />
    </radialGradient>

    <!-- Mouth Gradient -->
    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b1126" />
      <stop offset="100%" stop-color="#b82547" />
    </linearGradient>

    <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e04666" />
      <stop offset="100%" stop-color="#ff8da3" />
    </linearGradient>
  </defs>

  <!-- ================= WINGS ================= -->
  <!-- Left Wing -->
  <g id="left-wing" class="wing-left">
    <!-- Wing Membrane -->
    <path d="M 275 470 L 175 290 C 110 310, 50 370, 30 450 C 70 430, 100 455, 115 515 C 145 475, 175 480, 195 520 C 225 485, 255 485, 285 505 Z" fill="url(#wingMembrane)" stroke="#5ec8ff" stroke-width="2" />
    <!-- Wing Ice Facets / Veins -->
    <path d="M 175 290 L 115 515 M 175 290 L 195 520 M 115 410 L 160 430 M 65 400 L 130 390" stroke="#aef2ff" stroke-width="2" opacity="0.6" fill="none" />
    <!-- Gold Wing Arm -->
    <path d="M 285 485 C 235 455, 200 415, 175 295 C 115 305, 55 365, 30 450 C 45 350, 110 285, 180 270 C 210 380, 240 430, 295 465 Z" fill="url(#goldGrad)" stroke="#6e4209" stroke-width="2" />
    <!-- Gold Joint Knuckle -->
    <circle cx="180" cy="285" r="24" fill="url(#goldGrad)" stroke="#6e4209" stroke-width="2" />
    <!-- Wing Thumb Crystal -->
    <polygon points="172,272 185,240 198,275 184,285" fill="url(#crystalLight)" stroke="#0051b5" stroke-width="1.5" />
    <!-- Outer Edge Crystal -->
    <polygon points="155,278 90,295 80,320 145,305" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <polygon points="155,278 90,295 125,280" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Right Wing -->
  <g id="right-wing" class="wing-right">
    <!-- Wing Membrane -->
    <path d="M 485 470 L 605 280 C 675 300, 735 365, 760 445 C 715 425, 685 450, 670 510 C 640 470, 610 475, 590 515 C 560 480, 520 485, 475 505 Z" fill="url(#wingMembrane)" stroke="#5ec8ff" stroke-width="2" />
    <!-- Wing Ice Facets / Veins -->
    <path d="M 605 280 L 670 510 M 605 280 L 590 515 M 665 400 L 615 425 M 715 390 L 645 385" stroke="#aef2ff" stroke-width="2" opacity="0.6" fill="none" />
    <!-- Gold Wing Arm -->
    <path d="M 475 485 C 530 450, 575 410, 605 285 C 670 295, 730 355, 760 445 C 745 345, 675 275, 600 260 C 570 375, 530 425, 465 465 Z" fill="url(#goldGrad)" stroke="#6e4209" stroke-width="2" />
    <!-- Gold Joint Knuckle -->
    <circle cx="600" cy="275" r="24" fill="url(#goldGrad)" stroke="#6e4209" stroke-width="2" />
    <!-- Wing Thumb Crystal -->
    <polygon points="590,262 605,230 616,265 602,275" fill="url(#crystalLight)" stroke="#0051b5" stroke-width="1.5" />
    <!-- Outer Edge Crystal -->
    <polygon points="625,268 695,285 715,315 640,298" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <polygon points="625,268 695,285 665,272" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- ================= TAIL ================= -->
  <g id="tail" class="tail">
    <!-- Tail Spikes -->
    <polygon points="555,585 575,545 595,590" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <polygon points="590,595 615,555 630,600" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <!-- Tail Body -->
    <path d="M 490 600 C 555 615, 615 605, 650 565 C 660 615, 605 680, 480 665 Z" fill="url(#bodyGrad)" stroke="#6794bd" stroke-width="2" />
    <!-- Tail Tip Crystal -->
    <polygon points="635,585 660,515 690,565 655,610" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="2" />
    <polygon points="635,585 660,515 665,575" fill="url(#crystalLight)" />
  </g>

  <!-- ================= HIND LEGS & BODY ================= -->
  <!-- Right Hind Leg -->
  <g id="hind-leg">
    <ellipse cx="515" cy="605" rx="48" ry="65" fill="url(#bodyGrad)" stroke="#6794bd" stroke-width="2" />
    <ellipse cx="515" cy="665" rx="42" ry="25" fill="url(#bodyGrad)" stroke="#6794bd" stroke-width="2" />
    <!-- Hind Claws -->
    <path d="M 480 665 C 475 685, 495 685, 492 665 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
    <path d="M 505 668 C 500 690, 522 690, 518 668 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
    <path d="M 530 665 C 528 685, 548 685, 542 665 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
  </g>

  <!-- Main Torso -->
  <g id="torso">
    <path d="M 285 450 C 245 520, 255 635, 315 655 C 375 675, 455 665, 495 620 C 520 570, 500 480, 465 445 Z" fill="url(#bodyGrad)" stroke="#6794bd" stroke-width="2" />
    
    <!-- Plated Belly -->
    <path d="M 315 455 C 295 535, 305 615, 355 645 C 410 645, 435 545, 430 455 Z" fill="url(#bellyGrad)" stroke="#8cb3d9" stroke-width="2" />
    <!-- Belly Plate Lines -->
    <path d="M 312 490 L 372 520 L 430 490" fill="none" stroke="#8cb3d9" stroke-width="3" />
    <path d="M 307 535 L 370 565 L 430 535" fill="none" stroke="#8cb3d9" stroke-width="3" />
    <path d="M 312 580 L 368 610 L 422 580" fill="none" stroke="#8cb3d9" stroke-width="3" />
  </g>

  <!-- Shoulder Crystals -->
  <g id="shoulder-crystals" class="crystals">
    <!-- Left Shoulder Crystal -->
    <polygon points="285,485 245,425 260,515 295,525" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <polygon points="285,485 245,425 275,495" fill="url(#crystalLight)" />
    <!-- Right Shoulder Crystal -->
    <polygon points="445,495 505,435 485,520 435,535" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <polygon points="445,495 505,435 465,510" fill="url(#crystalLight)" />
  </g>

  <!-- Front Legs -->
  <g id="front-legs">
    <!-- Left Front Leg -->
    <path d="M 275 495 C 255 555, 255 620, 250 660 C 275 675, 325 675, 340 655 C 340 610, 335 555, 320 515" fill="url(#bodyGrad)" stroke="#6794bd" stroke-width="2" />
    <!-- Left Front Claws -->
    <path d="M 242 655 C 228 680, 255 685, 262 662 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
    <path d="M 268 662 C 255 690, 285 692, 290 665 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
    <path d="M 298 662 C 290 690, 318 690, 320 662 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />

    <!-- Right Front Leg -->
    <path d="M 435 510 C 415 565, 395 625, 390 675 C 420 695, 475 695, 495 670 C 495 620, 495 555, 480 500" fill="url(#bodyGrad)" stroke="#6794bd" stroke-width="2" />
    <!-- Right Front Claws -->
    <path d="M 382 672 C 368 702, 398 705, 405 678 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
    <path d="M 412 680 C 402 710, 432 712, 438 682 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
    <path d="M 445 680 C 440 710, 468 710, 470 678 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
    <path d="M 475 674 C 475 700, 498 698, 495 670 Z" fill="url(#crystalGrad)" stroke="#003d82" stroke-width="1.5" />
  </g>

  <!-- ================= HEAD & CROWN CRYSTALS ================= -->
  <g id="head" class="head">
    <!-- Back Ear/Cheek Fin Crystals (Left) -->
    <polygon points="245,280 230,130 310,235" fill="url(#bellyGrad)" stroke="#5ec8ff" stroke-width="2" />
    <polygon points="255,275 235,155 295,240" fill="url(#crystalGrad)" />
    <polygon points="245,310 210,245 265,275" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />

    <!-- Back Ear/Cheek Fin Crystals (Right) -->
    <polygon points="465,245 595,180 540,295" fill="url(#bellyGrad)" stroke="#5ec8ff" stroke-width="2" />
    <polygon points="475,255 585,190 525,295" fill="url(#crystalGrad)" />
    <polygon points="510,295 585,280 525,345" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <polygon points="510,340 565,355 505,385" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <polygon points="495,385 545,405 485,420" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />

    <!-- Center Crown Crystals -->
    <!-- Left Small Horn -->
    <polygon points="305,235 315,175 345,225" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <!-- Right Small Horn -->
    <polygon points="405,225 445,165 445,245" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <!-- Main Center Tall Crystal Horn -->
    <polygon points="335,240 395,95 415,245 370,275" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="2" />
    <polygon points="335,240 395,95 375,255" fill="url(#crystalLight)" />

    <!-- Main Head Base Shape -->
    <path d="M 255 265 C 225 320, 210 390, 245 430 C 275 465, 315 485, 355 485 C 405 485, 465 455, 495 415 C 525 375, 505 300, 465 255 C 420 215, 300 215, 255 265 Z" fill="url(#bodyGrad)" stroke="#6794bd" stroke-width="2" />

    <!-- Forehead Diamond Gem -->
    <polygon points="355,245 372,280 355,318 338,280" fill="url(#crystalGrad)" stroke="#0051b5" stroke-width="1.5" />
    <polygon points="355,245 365,280 355,318 345,280" fill="url(#crystalLight)" opacity="0.7" />

    <!-- Mouth Interior -->
    <path d="M 278 395 C 315 420, 375 420, 430 392 C 405 460, 365 478, 335 472 C 300 465, 288 430, 278 395 Z" fill="url(#mouthGrad)" stroke="#4a0918" stroke-width="2" />
    <!-- Tongue -->
    <path d="M 305 432 C 325 418, 365 422, 385 442 C 370 468, 345 472, 325 465 C 310 458, 305 445, 305 432 Z" fill="url(#tongueGrad)" />
    <!-- Sharp Little Teeth -->
    <polygon points="295,402 302,415 310,406" fill="#ffffff" />
    <polygon points="382,408 390,420 398,403" fill="#ffffff" />
    <polygon points="302,445 310,438 312,452" fill="#ffffff" />
    <polygon points="375,455 380,442 388,448" fill="#ffffff" />

    <!-- Upper Snout / Smile Line -->
    <path d="M 255 380 C 285 415, 325 420, 355 415 C 385 415, 425 400, 448 380" fill="url(#bodyGrad)" stroke="#5b87b0" stroke-width="2.5" stroke-linecap="round" />

    <!-- Nostrils -->
    <ellipse cx="315" cy="378" rx="6" ry="4" transform="rotate(20 315 378)" fill="#3b5e82" />
    <ellipse cx="362" cy="378" rx="6" ry="4" transform="rotate(-20 362 378)" fill="#3b5e82" />

    <!-- ================= EYES & EYEBROWS ================= -->
    <!-- Left Eye -->
    <g id="left-eye" class="eyes">
      <ellipse cx="282" cy="332" rx="34" ry="44" fill="#ffffff" stroke="#4a77a3" stroke-width="2" />
      <ellipse cx="286" cy="334" rx="26" ry="35" fill="url(#eyeIris)" />
      <ellipse cx="288" cy="334" rx="16" ry="22" fill="#020b18" />
      <!-- Eye Highlights -->
      <circle cx="274" cy="314" r="9" fill="#ffffff" />
      <circle cx="298" cy="350" r="4.5" fill="#ffffff" />
    </g>

    <!-- Right Eye -->
    <g id="right-eye" class="eyes">
      <ellipse cx="435" cy="338" rx="42" ry="46" fill="#ffffff" stroke="#4a77a3" stroke-width="2" />
      <ellipse cx="430" cy="340" rx="33" ry="37" fill="url(#eyeIris)" />
      <ellipse cx="428" cy="340" rx="20" ry="23" fill="#020b18" />
      <!-- Eye Highlights -->
      <circle cx="414" cy="318" r="10" fill="#ffffff" />
      <circle cx="444" cy="356" r="5" fill="#ffffff" />
    </g>

    <!-- Eyebrows -->
    <path d="M 248 282 C 262 252, 295 252, 312 272 C 292 265, 265 268, 248 282 Z" fill="#1864ab" stroke="#0b3c6e" stroke-width="1" />
    <path d="M 398 275 C 425 248, 468 255, 485 288 C 462 270, 425 265, 398 275 Z" fill="#1864ab" stroke="#0b3c6e" stroke-width="1" />
  </g>
</svg>