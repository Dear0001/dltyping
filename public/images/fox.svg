<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="little-fox">
    <!-- Far legs (darker) -->
    <g class="leg-left leg-back">
      <ellipse cx="33" cy="68" rx="7.5" ry="9" fill="#c4553a" />
      <path d="M 28.5 70 L 37.5 70 L 36.3 91 L 29.7 91 Z" fill="#c4553a" stroke="#c4553a" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="28.8" y="84" width="8.4" height="8" rx="3" fill="#1d3640" />
      <rect x="28.8" y="88" width="12" height="7.5" rx="3.7" fill="#1d3640" />
    </g>
    <g class="leg-right leg-front">
      <ellipse cx="49" cy="68" rx="7.5" ry="9" fill="#c4553a" />
      <path d="M 44.5 70 L 53.5 70 L 52.3 91 L 45.7 91 Z" fill="#c4553a" stroke="#c4553a" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="44.8" y="84" width="8.4" height="8" rx="3" fill="#1d3640" />
      <rect x="44.8" y="88" width="12" height="7.5" rx="3.7" fill="#1d3640" />
    </g>

    <!-- Big bushy tail with white tip -->
    <path class="tail" d="M 22 58 Q 2 66 3 40 Q 4 24 15 20 Q 13 38 30 52 Z" fill="#e76f51" />
    <path class="tail-tip" d="M 15 20 Q 6 21 3.5 32 Q 9 31 12 36 Q 15 28 15 20 Z" fill="#fff6ee" stroke="#f1c8b6" stroke-width="1" />

    <!-- Body -->
    <ellipse class="body" cx="41" cy="62" rx="28" ry="16" fill="#e76f51" />
    <ellipse class="belly" cx="40" cy="69" rx="14" ry="6" fill="#fff6ee" stroke="#f1c8b6" stroke-width="1" />

    <!-- Near legs, drawn over the body so they join it -->
    <g class="leg-right leg-back">
      <ellipse cx="20" cy="68" rx="7.5" ry="9" fill="#e76f51" />
      <path d="M 15.5 70 L 24.5 70 L 23.3 91 L 16.7 91 Z" fill="#e76f51" stroke="#e76f51" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="15.8" y="84" width="8.4" height="8" rx="3" fill="#264653" />
      <rect x="15.8" y="88" width="12" height="7.5" rx="3.7" fill="#264653" />
    </g>
    <g class="leg-left leg-front">
      <ellipse cx="62" cy="68" rx="7.5" ry="9" fill="#e76f51" />
      <path d="M 57.5 70 L 66.5 70 L 65.3 91 L 58.7 91 Z" fill="#e76f51" stroke="#e76f51" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="57.8" y="84" width="8.4" height="8" rx="3" fill="#264653" />
      <rect x="57.8" y="88" width="12" height="7.5" rx="3.7" fill="#264653" />
    </g>

    <!-- Head -->
    <g class="head">
      <polygon class="ear-left" points="58,32 61,10 74,27" fill="#e76f51" />
      <polygon points="61,28 63,17 69,26" fill="#264653" />
      <polygon class="ear-right" points="74,27 87,10 90,32" fill="#c4553a" />
      <polygon points="78,27 86,18 88,30" fill="#264653" />
      <circle cx="73" cy="44" r="16" fill="#e76f51" />
      <!-- Pointed white muzzle -->
      <path class="face-white" d="M 70 38 Q 84 36 98 49 Q 90 60 72 58 Q 66 48 70 38 Z" fill="#fff6ee" stroke="#f1c8b6" stroke-width="1" />
      <g class="eyes">
        <circle cx="69" cy="41" r="3.3" fill="#264653" /><circle cx="68" cy="40" r="1" fill="#ffffff" />
        <circle cx="81" cy="41" r="3.3" fill="#264653" /><circle cx="80" cy="40" r="1" fill="#ffffff" />
      </g>
      <ellipse class="nose" cx="97" cy="49" rx="3.2" ry="2.6" fill="#264653" />
    </g>
  </g>
</svg>
