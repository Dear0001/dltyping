<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="little-fox">
    <!-- Tail -->
    <path class="tail" d="M 60 70 Q 100 80 85 40 Q 70 40 60 60" fill="#e76f51" />
    <path class="tail-tip" d="M 85 40 Q 82 48 76 50 Q 76 43 85 40" fill="#ffffff" />
    
    <!-- Body -->
    <circle class="body" cx="50" cy="65" r="22" fill="#e76f51" />
    <ellipse class="belly" cx="50" cy="72" rx="12" ry="14" fill="#ffffff" />
    
    <!-- Head -->
    <g class="head">
      <!-- Ears -->
      <polygon class="ear-left" points="25,25 40,35 32,45" fill="#e76f51" />
      <polygon points="28,29 37,36 32,42" fill="#ffffff" />
      <polygon class="ear-right" points="75,25 60,35 68,45" fill="#e76f51" />
      <polygon points="72,29 63,36 68,42" fill="#ffffff" />
      
      <!-- Face base -->
      <circle cx="50" cy="45" r="20" fill="#e76f51" />
      
      <!-- White muzzle -->
      <path class="face-white" d="M 32 48 Q 50 70 68 48 Q 75 60 50 63 Q 25 60 32 48" fill="#ffffff" />
      
      <!-- Eyes & Nose -->
      <g class="eyes">
        <circle cx="40" cy="46" r="3.5" fill="#264653" />
        <circle cx="39" cy="45" r="1" fill="#ffffff" />
        <circle cx="60" cy="46" r="3.5" fill="#264653" />
        <circle cx="59" cy="45" r="1" fill="#ffffff" />
      </g>
      <ellipse class="nose" cx="50" cy="54" rx="4" ry="3" fill="#264653" />
    </g>
  </g>
</svg>