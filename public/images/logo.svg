<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <!-- Top-to-bottom linear gradient matching the "L" -->
    <linearGradient id="l-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  
  <g>
    <!-- Custom "D" shape with exact inner cutout using evenodd fill rule -->
    <path d="M 40 40 H 85 A 50 50 0 0 1 85 140 H 40 Z M 75 70 H 85 A 20 20 0 0 1 85 110 H 75 Z" fill="#0f172a" fill-rule="evenodd" />
    
    <!-- "L" shape with matching stem width and gradient -->
    <path d="M 145 40 H 180 V 110 H 240 V 140 H 145 Z" fill="url(#l-grad)" />
    
    <!-- Four-pointed sparkle placed in the top right negative space of the "L" -->
    <path d="M 215 30 Q 215 60 245 60 Q 215 60 215 90 Q 215 60 185 60 Q 215 60 215 30 Z" fill="#38bdf8" />
  </g>
  
  <!-- "Typing" text appended, aligned to the baseline of the logo mark -->
  <text x="260" y="140" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="135" font-weight="900" fill="#0f172a" letter-spacing="-3">Typing</text>
</svg>