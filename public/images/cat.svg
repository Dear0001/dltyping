<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="baby-cat">
    <!-- Far legs (darker) -->
    <g class="leg-left leg-back">
      <ellipse cx="33" cy="68" rx="7.5" ry="9" fill="#d9870a" />
      <path d="M 28.5 70 L 37.5 70 L 36.3 91 L 29.7 91 Z" fill="#d9870a" stroke="#d9870a" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="28.8" y="88" width="12" height="7.5" rx="3.7" fill="#f3d7a0" />
    </g>
    <g class="leg-right leg-front">
      <ellipse cx="49" cy="68" rx="7.5" ry="9" fill="#d9870a" />
      <path d="M 44.5 70 L 53.5 70 L 52.3 91 L 45.7 91 Z" fill="#d9870a" stroke="#d9870a" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="44.8" y="88" width="12" height="7.5" rx="3.7" fill="#f3d7a0" />
    </g>

    <!-- Tail -->
    <path class="tail" d="M 18 58 Q 3 56 7 34" stroke="#fca311" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Body -->
    <ellipse class="body" cx="40" cy="62" rx="28" ry="17" fill="#fca311" />
    <ellipse cx="38" cy="69" rx="14" ry="6.5" fill="#ffe5b4" />
    <path d="M 26 48 Q 28 54 26 58 M 36 46 Q 38 52 36 57 M 46 46 Q 48 52 46 57" stroke="#d9870a" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Near legs, drawn over the body so they join it -->
    <g class="leg-right leg-back">
      <ellipse cx="20" cy="68" rx="7.5" ry="9" fill="#fca311" />
      <path d="M 15.5 70 L 24.5 70 L 23.3 91 L 16.7 91 Z" fill="#fca311" stroke="#fca311" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="15.8" y="88" width="12" height="7.5" rx="3.7" fill="#ffe5b4" />
    </g>
    <g class="leg-left leg-front">
      <ellipse cx="62" cy="68" rx="7.5" ry="9" fill="#fca311" />
      <path d="M 57.5 70 L 66.5 70 L 65.3 91 L 58.7 91 Z" fill="#fca311" stroke="#fca311" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="57.8" y="88" width="12" height="7.5" rx="3.7" fill="#ffe5b4" />
    </g>

    <!-- Head -->
    <g class="head">
      <polygon class="ear-left" points="57,32 60,12 73,27" fill="#fca311" />
      <polygon points="60,29 62,19 69,27" fill="#ffb6c1" />
      <polygon class="ear-right" points="73,27 86,12 90,32" fill="#d9870a" />
      <polygon points="77,27 85,19 87,30" fill="#ffb6c1" />
      <circle cx="73" cy="44" r="17" fill="#fca311" />
      <g class="eyes">
        <circle cx="68" cy="41" r="3.5" fill="#14213d" /><circle cx="67" cy="40" r="1" fill="#ffffff" />
        <circle cx="82" cy="41" r="3.5" fill="#14213d" /><circle cx="81" cy="40" r="1" fill="#ffffff" />
      </g>
      <ellipse cx="82" cy="48" rx="3" ry="2" fill="#ffb6c1" />
      <path class="mouth" d="M 76 52 Q 80 56 86 51" stroke="#14213d" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M 84 49 L 96 46 M 84 51 L 96 52" stroke="#14213d" stroke-width="1" stroke-linecap="round" opacity=".5" />
    </g>
  </g>
</svg>
