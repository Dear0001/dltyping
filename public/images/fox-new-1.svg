<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Orange Fur Gradients -->
    <linearGradient id="orangeFur" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fbbd72" />
      <stop offset="50%" stop-color="#f28f42" />
      <stop offset="100%" stop-color="#c45921" />
    </linearGradient>

    <linearGradient id="orangeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e37c34" />
      <stop offset="60%" stop-color="#bd531d" />
      <stop offset="100%" stop-color="#87330e" />
    </linearGradient>

    <!-- White / Cream Fur Gradients -->
    <linearGradient id="whiteFur" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#ebe5df" />
      <stop offset="100%" stop-color="#bfb5ae" />
    </linearGradient>

    <linearGradient id="whiteShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ded6cf" />
      <stop offset="100%" stop-color="#a89e97" />
    </linearGradient>

    <!-- Cyan Magic Tip & Marking Gradients -->
    <linearGradient id="cyanTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f7ff" />
      <stop offset="55%" stop-color="#9ad7f0" />
      <stop offset="100%" stop-color="#62a8c9" />
    </linearGradient>

    <linearGradient id="cyanMark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cd4f7" />
      <stop offset="100%" stop-color="#3a9cc7" />
    </linearGradient>

    <!-- Inner Ear Pink Gradient -->
    <linearGradient id="earPink" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#f5aba8" />
      <stop offset="55%" stop-color="#d97d81" />
      <stop offset="100%" stop-color="#a14b53" />
    </linearGradient>

    <!-- Eye Iris Gradient (Red-Brown to Golden Amber) -->
    <linearGradient id="amberIris" x1="0%" y1="10%" x2="0%" y2="95%">
      <stop offset="0%" stop-color="#4d140e" />
      <stop offset="45%" stop-color="#9e2a17" />
      <stop offset="80%" stop-color="#e87b1e" />
      <stop offset="100%" stop-color="#ffcb3d" />
    </linearGradient>

    <!-- Collar & Charms Gradients -->
    <linearGradient id="leatherCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e2817" />
      <stop offset="50%" stop-color="#7d3822" />
      <stop offset="100%" stop-color="#42190c" />
    </linearGradient>

    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875" />
      <stop offset="55%" stop-color="#dfab28" />
      <stop offset="100%" stop-color="#966a0c" />
    </linearGradient>

    <linearGradient id="crystalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e7ff" />
      <stop offset="50%" stop-color="#33a1d4" />
      <stop offset="100%" stop-color="#145882" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#291811" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ================= TAIL ================= -->
  <g id="tail" class="tail" filter="url(#dropShadow)">
    <!-- Cyan Fluffy Tip -->
    <path d="M 198 232 
             C 155 245, 118 292, 118 355 
             C 145 350, 195 340, 222 330 
             C 208 295, 192 268, 198 232 Z" fill="url(#cyanTip)" />

    <!-- Orange Fluffy Base -->
    <path d="M 122 335 
             L 132 308 L 152 330 
             L 175 298 L 190 322 
             L 208 295 L 222 325 
             L 234 318 L 240 365 
             L 215 470 
             C 175 468, 145 445, 138 422 L 152 420 
             C 132 405, 120 385, 116 365 L 130 362 
             C 118 352, 116 342, 122 335 Z" fill="url(#orangeFur)" />

    <!-- Darker Under-Tail Layering -->
    <path d="M 138 395 L 126 385 L 155 390 L 138 422 C 165 445, 195 460, 222 462 L 235 415 Z" fill="url(#orangeDark)" opacity="0.75" />

    <!-- Cyan Tail Flecks -->
    <path d="M 180 345 Q 190 352 194 362 Q 182 358 180 345 Z" fill="url(#cyanMark)" />
    <path d="M 170 368 Q 185 370 192 380 L 172 380 Z" fill="url(#cyanMark)" />
  </g>

  <!-- ================= BACK LEGS & HINDQUARTERS ================= -->
  <g id="hindquarters" filter="url(#dropShadow)">
    <!-- Back Right Leg (Far/Underneath) -->
    <path d="M 325 435 L 330 495 L 368 495 L 368 435 Z" fill="url(#orangeDark)" />
    <path d="M 328 475 L 352 465 L 368 478 L 372 505 L 328 505 Z" fill="url(#whiteShadow)" />
    <ellipse cx="350" cy="506" rx="24" ry="11" fill="url(#whiteShadow)" />
    <path d="M 338 500 L 338 512 M 352 499 L 352 513 M 364 501 L 364 511" stroke="#8c827b" stroke-width="2" stroke-linecap="round" />

    <!-- Main Haunch & Back (Viewer's Left) -->
    <path d="M 212 435 
             C 208 380, 240 340, 285 335 
             L 310 435 
             C 295 468, 265 480, 255 482 
             L 222 480 
             L 212 452 L 222 445 Z" fill="url(#orangeFur)" />

    <!-- Cyan Back Stripes -->
    <path d="M 248 355 Q 268 352 280 362 Q 262 366 248 355 Z" fill="url(#cyanMark)" />
    <path d="M 230 375 Q 245 368 258 372 Q 242 382 230 375 Z" fill="url(#cyanMark)" />
    <path d="M 262 375 Q 278 368 292 375 Q 275 385 262 375 Z" fill="url(#cyanMark)" />

    <!-- Back Left Paw (Viewer's Left) -->
    <path d="M 222 470 L 235 458 L 245 470 L 256 462 L 260 502 L 216 502 Z" fill="url(#whiteFur)" />
    <path d="M 212 504 Q 212 485 238 485 Q 264 485 264 504 Q 264 514 238 514 Q 212 514 212 504 Z" fill="url(#whiteFur)" />
    <path d="M 227 492 L 227 512 M 240 490 L 240 513 M 252 492 L 252 511" stroke="#a69c94" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= TORSO & CHEST RUFF ================= -->
  <g id="torso" class="body" filter="url(#dropShadow)">
    <!-- Right Shoulder (Viewer's Right) -->
    <path d="M 355 365 Q 425 385 415 445 L 345 455 Z" fill="url(#orangeDark)" />

    <!-- White Chest Ruff (Layered Spikes) -->
    <path d="M 285 348 
             L 272 378 L 295 376 
             L 292 408 L 315 395 
             L 335 455 L 372 442 
             L 395 398 L 410 400 
             L 398 375 L 415 365 
             L 392 345 Z" fill="url(#whiteShadow)" />
    <path d="M 288 342 
             L 275 372 L 296 370 
             L 295 402 L 318 388 
             L 342 422 L 368 388 
             L 385 405 L 392 372 
             L 412 362 L 390 342 Z" fill="url(#whiteFur)" />
  </g>

  <!-- ================= FRONT LEGS ================= -->
  <g id="front-legs" filter="url(#dropShadow)">
    <!-- Front Planted Leg (Viewer's Left) -->
    <path d="M 262 385 
             L 255 405 L 265 405 
             L 285 495 
             L 335 495 
             L 328 400 Z" fill="url(#orangeFur)" />
    <!-- Zigzag White Sock -->
    <path d="M 282 478 L 292 455 L 304 472 L 318 450 L 332 475 L 342 522 L 290 522 Z" fill="url(#whiteFur)" />
    <!-- Front Planted Paw -->
    <path d="M 290 522 Q 290 496 320 496 Q 350 496 350 522 Q 350 534 320 534 Q 290 534 290 522 Z" fill="url(#whiteFur)" />
    <path d="M 307 505 L 307 531 M 322 503 L 322 532 M 336 506 L 336 530" stroke="#a69c94" stroke-width="2.5" stroke-linecap="round" />

    <!-- Front Raised Leg (Viewer's Right) -->
    <path d="M 372 415 
             Q 408 405 415 445 
             L 370 455 Z" fill="url(#orangeFur)" />
    <!-- Raised White Paw -->
    <path d="M 370 448 
             L 382 435 L 390 445 
             L 402 432 L 414 445 
             C 420 470, 415 498, 392 498 
             C 368 498, 365 475, 370 448 Z" fill="url(#whiteFur)" />
    <path d="M 380 476 L 380 495 M 394 478 L 394 497 M 406 476 L 406 493" stroke="#a69c94" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- ================= COLLAR & CHARMS ================= -->
  <g id="collar" filter="url(#dropShadow)">
    <!-- Brown Leather Strap -->
    <path d="M 288 335 Q 342 365 396 322 L 396 342 Q 342 385 288 354 Z" fill="url(#leatherCollar)" />
    <!-- Gold Studs -->
    <circle cx="305" cy="349" r="2.5" fill="#f5c542" />
    <circle cx="316" cy="356" r="2.5" fill="#f5c542" />

    <!-- Blue Crystal Charm -->
    <polygon points="319,360 326,374 321,396 315,392 312,374" fill="url(#crystalBlue)" />
    <polygon points="319,360 326,374 319,376 312,374" fill="#bef0ff" opacity="0.7" />

    <!-- Gold Clasp & Star Charm -->
    <rect x="340" y="348" width="7" height="18" rx="3" fill="url(#goldStar)" />
    <polygon points="346,358 352,370 365,372 356,381 359,394 346,388 334,394 337,381 328,372 340,370" fill="#875c08" transform="translate(2, 2)" />
    <polygon points="346,358 352,370 365,372 356,381 359,394 346,388 334,394 337,381 328,372 340,370" fill="url(#goldStar)" />
  </g>

  <!-- ================= HEAD & EARS ================= -->
  <g id="head" class="head" filter="url(#dropShadow)">
    <!-- Left Ear (Viewer's Left) -->
    <g id="left-ear" class="ear-left">
      <path d="M 218 248 
               L 192 222 L 208 218 
               C 182 178, 170 125, 174 85 
               C 212 95, 255 138, 275 182 Z" fill="url(#orangeFur)" />
      <!-- Cyan Ear Tip & Stripe -->
      <path d="M 174 85 
               C 192 88, 212 102, 226 118 
               C 210 115, 192 108, 182 128 
               C 175 110, 173 95, 174 85 Z" fill="url(#cyanTip)" />
      <path d="M 225 118 C 242 142, 242 162, 258 182 C 248 160, 250 140, 225 118 Z" fill="url(#cyanMark)" />
      <!-- Pink Inner Ear -->
      <path d="M 215 225 C 190 180, 180 130, 182 102 C 212 115, 242 152, 255 192 Z" fill="url(#earPink)" />
      <!-- White Ear Tufts -->
      <path d="M 248 215 
               L 215 215 L 228 200 
               L 208 188 L 228 178 
               L 215 152 L 245 172 
               L 258 195 Z" fill="url(#whiteFur)" />
    </g>

    <!-- Right Ear (Viewer's Right) -->
    <g id="right-ear" class="ear-right">
      <path d="M 342 175 
               C 368 122, 418 75, 462 58 
               C 478 108, 468 168, 442 212 
               L 458 210 L 428 242 Z" fill="url(#orangeFur)" />
      <!-- Cyan Ear Tip & Stripe -->
      <path d="M 462 58 
               C 474 92, 472 125, 466 148 
               C 460 125, 455 95, 442 85 
               C 425 95, 412 105, 398 112 
               C 418 88, 442 68, 462 58 Z" fill="url(#cyanTip)" />
      <path d="M 398 112 C 378 135, 385 158, 365 178 C 372 155, 368 135, 398 112 Z" fill="url(#cyanMark)" />
      <!-- Pink Inner Ear -->
      <path d="M 368 188 C 392 142, 428 98, 454 82 C 462 122, 448 175, 418 222 Z" fill="url(#earPink)" />
      <!-- White Ear Tufts -->
      <path d="M 382 215 
               L 422 208 L 408 192 
               L 432 178 L 408 168 
               L 422 135 L 392 162 
               L 375 192 Z" fill="url(#whiteFur)" />
    </g>

    <!-- Upper Head Orange Base & Crown Tufts -->
    <path d="M 225 235 
             L 210 245 L 222 255 
             L 205 272 L 225 280 
             L 398 280 
             L 432 252 L 408 245 
             L 435 225 L 400 220 
             C 385 190, 365 172, 345 168 
             L 348 155 L 332 162 
             L 325 148 L 312 162 
             L 298 142 L 292 162 
             L 278 152 L 278 168 
             C 252 175, 235 198, 225 235 Z" fill="url(#orangeFur)" />

    <!-- Forehead Cyan Markings -->
    <path d="M 268 168 Q 262 185 282 202 Q 278 185 268 168 Z" fill="url(#cyanMark)" />
    <path d="M 358 168 Q 345 182 332 202 Q 352 190 358 168 Z" fill="url(#cyanMark)" />

    <!-- Cream Oval Eyebrows -->
    <ellipse cx="268" cy="206" rx="12" ry="6.5" transform="rotate(22 268 206)" fill="url(#whiteFur)" />
    <ellipse cx="342" cy="204" rx="12" ry="6.5" transform="rotate(-22 342 204)" fill="url(#whiteFur)" />

    <!-- White Cheek Fur & Forehead Blaze -->
    <path d="M 308 175 
             L 298 202 L 290 198 
             L 292 255 
             C 265 268, 238 275, 205 278 
             L 222 292 L 208 298 
             C 228 328, 268 348, 315 348 
             C 365 348, 408 328, 438 295 
             L 418 288 L 448 262 
             C 405 265, 368 268, 332 255 
             L 328 198 L 320 204 Z" fill="url(#whiteFur)" />

    <!-- Pink Cheek Spots -->
    <ellipse cx="242" cy="295" rx="6" ry="3.5" transform="rotate(10 242 295)" fill="#eb9496" opacity="0.8" />
    <ellipse cx="235" cy="284" rx="3.5" ry="2" transform="rotate(10 235 284)" fill="#eb9496" opacity="0.6" />
    <ellipse cx="385" cy="285" rx="7" ry="4" transform="rotate(-12 385 285)" fill="#eb9496" opacity="0.8" />
    <ellipse cx="394" cy="274" rx="4.5" ry="2.5" transform="rotate(-12 394 274)" fill="#eb9496" opacity="0.6" />

    <!-- ================= EYES ================= -->
    <!-- Left Eye (Viewer's Left) -->
    <g id="left-eye" class="eyes">
      <!-- Eyeliner & Wing -->
      <path d="M 228 246 
               L 238 246 
               C 246 225, 272 222, 285 238 
               C 292 250, 290 272, 278 280 
               C 262 288, 240 280, 236 260 
               L 228 246 Z" fill="#1f0d09" />
      <!-- Sclera -->
      <path d="M 240 258 C 240 235, 265 228, 280 240 C 288 248, 286 270, 276 277 C 260 284, 240 275, 240 258 Z" fill="#f7f2f0" />
      <!-- Amber Iris -->
      <ellipse cx="264" cy="256" rx="20" ry="22" fill="url(#amberIris)" />
      <!-- Pupil -->
      <ellipse cx="266" cy="255" rx="12" ry="14" fill="#1a0705" />
      <!-- Catchlights -->
      <circle cx="256" cy="244" r="6" fill="#ffffff" />
      <circle cx="274" cy="266" r="2.5" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Right Eye (Viewer's Right) -->
    <g id="right-eye" class="eyes">
      <!-- Eyeliner & Wing -->
      <path d="M 332 238 
               C 345 218, 375 218, 388 240 
               L 398 236 L 392 252 
               C 390 272, 372 282, 350 278 
               C 332 274, 326 254, 332 238 Z" fill="#1f0d09" />
      <!-- Sclera -->
      <path d="M 335 252 C 335 230, 362 224, 380 238 C 388 246, 386 268, 372 275 C 352 280, 335 270, 335 252 Z" fill="#f7f2f0" />
      <!-- Amber Iris -->
      <ellipse cx="358" cy="252" rx="21" ry="22" fill="url(#amberIris)" />
      <!-- Pupil -->
      <ellipse cx="356" cy="251" rx="13" ry="14" fill="#1a0705" />
      <!-- Catchlights -->
      <circle cx="348" cy="240" r="6.5" fill="#ffffff" />
      <circle cx="367" cy="262" r="3" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- ================= SNOUT, NOSE & MOUTH ================= -->
    <g id="muzzle">
      <!-- Open Mouth & Tongue -->
      <path d="M 294 302 
               Q 312 308 332 300 
               Q 325 322 311 322 
               Q 298 322 294 302 Z" fill="#421215" />
      <path d="M 299 310 
               Q 312 306 325 310 
               Q 320 320 311 320 
               Q 302 320 299 310 Z" fill="#e86f78" />

      <!-- Muzzle Pads -->
      <path d="M 278 292 
               Q 288 308 310 302 
               Q 332 308 345 290 
               Q 332 276 310 276 
               Q 290 276 278 292 Z" fill="url(#whiteFur)" />

      <!-- Smile Line -->
      <path d="M 276 292 Q 290 308 310 302 Q 330 308 346 288" fill="none" stroke="#4a251d" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 273 290 L 278 295 M 349 286 L 344 291" stroke="#4a251d" stroke-width="2" stroke-linecap="round" />

      <!-- Dark Brown Nose -->
      <path d="M 296 278 
               Q 309 272 322 278 
               Q 324 286 309 293 
               Q 294 286 296 278 Z" fill="#361812" />
      <ellipse cx="308" cy="279" rx="7" ry="2.5" fill="#6e4238" opacity="0.65" />
    </g>
  </g>
</svg>