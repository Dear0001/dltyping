<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="lion">
    <!-- Tail with tuft -->
    <g class="tail">
      <path d="M 68 78 Q 90 80 90 58" stroke="#e0a030" stroke-width="5" fill="none" stroke-linecap="round" />
      <ellipse cx="90" cy="54" rx="6" ry="8" fill="#b45309" />
    </g>
    <!-- Feet -->
    <ellipse cx="38" cy="92" rx="9" ry="4.5" fill="#d98a1c" />
    <ellipse cx="62" cy="92" rx="9" ry="4.5" fill="#d98a1c" />
    <!-- Body -->
    <ellipse class="body" cx="50" cy="72" rx="21" ry="20" fill="#f2b84b" />
    <ellipse cx="50" cy="76" rx="12" ry="13" fill="#fde7b0" />
    <!-- Head with mane -->
    <g class="head">
      <circle class="mane" cx="50" cy="42" r="29" fill="#b45309" />
      <circle cx="30" cy="30" r="8" fill="#92400e" />
      <circle cx="70" cy="30" r="8" fill="#92400e" />
      <circle cx="24" cy="46" r="8" fill="#92400e" />
      <circle cx="76" cy="46" r="8" fill="#92400e" />
      <circle cx="34" cy="62" r="7" fill="#92400e" />
      <circle cx="66" cy="62" r="7" fill="#92400e" />
      <circle class="ear-left" cx="33" cy="25" r="6" fill="#f2b84b" />
      <circle class="ear-right" cx="67" cy="25" r="6" fill="#f2b84b" />
      <circle cx="33" cy="25" r="3" fill="#f9a8a8" />
      <circle cx="67" cy="25" r="3" fill="#f9a8a8" />
      <circle cx="50" cy="44" r="21" fill="#f2b84b" />
      <ellipse cx="50" cy="53" rx="12" ry="9" fill="#fde7b0" />
      <g class="eyes">
        <circle cx="41" cy="41" r="3.2" fill="#1c1917" />
        <circle cx="59" cy="41" r="3.2" fill="#1c1917" />
        <circle cx="42" cy="40" r="1" fill="#ffffff" />
        <circle cx="60" cy="40" r="1" fill="#ffffff" />
      </g>
      <path class="nose" d="M 46 48 L 54 48 L 50 53 Z" fill="#9a3412" />
      <path d="M 50 53 L 50 56 M 44 58 Q 50 62 56 58" stroke="#7c2d12" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
