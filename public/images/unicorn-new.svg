<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- White Coat Gradients -->
    <linearGradient id="whiteBody" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#eef4f8" />
      <stop offset="100%" stop-color="#c3d1de" />
    </linearGradient>

    <linearGradient id="whiteShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8e3ed" />
      <stop offset="100%" stop-color="#9eb0c2" />
    </linearGradient>

    <radialGradient id="headWhite" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="68%" stop-color="#eef4f9" />
      <stop offset="100%" stop-color="#bdd0e0" />
    </radialGradient>

    <!-- Pink Hooves & Inner Ear Gradients -->
    <linearGradient id="hoofPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa8cb" />
      <stop offset="55%" stop-color="#e86fa0" />
      <stop offset="100%" stop-color="#b03b6b" />
    </linearGradient>

    <linearGradient id="earPink" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff9ec4" />
      <stop offset="60%" stop-color="#d95b8d" />
      <stop offset="100%" stop-color="#9e355f" />
    </linearGradient>

    <!-- Rainbow Hair Gradients -->
    <linearGradient id="hairPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffadd2" />
      <stop offset="50%" stop-color="#f264a0" />
      <stop offset="100%" stop-color="#b8326d" />
    </linearGradient>

    <linearGradient id="hairYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3a1" />
      <stop offset="55%" stop-color="#ffd252" />
      <stop offset="100%" stop-color="#d98a2b" />
    </linearGradient>

    <linearGradient id="hairBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8f2ff" />
      <stop offset="55%" stop-color="#5ec2eb" />
      <stop offset="100%" stop-color="#2c7bb0" />
    </linearGradient>

    <linearGradient id="hairPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cca6ff" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c2896" />
    </linearGradient>

    <!-- Golden Horn Gradient -->
    <linearGradient id="goldHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099" />
      <stop offset="45%" stop-color="#f5b038" />
      <stop offset="100%" stop-color="#a85c11" />
    </linearGradient>

    <!-- Blue Eye Iris Gradient -->
    <linearGradient id="eyeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3b5c" />
      <stop offset="50%" stop-color="#3a89c9" />
      <stop offset="100%" stop-color="#8ce0ff" />
    </linearGradient>

    <!-- Rosy Cheek Blush -->
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fb8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ff8fb8" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ================= BACK MANE CURLS ================= -->
  <g id="mane-back" filter="url(#softShadow)">
    <!-- Lower Pink & Purple Curls (Viewer's Left) -->
    <path d="M 155 320 
             C 95 330, 80 410, 130 435 
             C 95 445, 95 505, 145 502 
             C 185 500, 195 455, 165 445 
             C 140 440, 130 470, 152 472 
             C 135 485, 118 465, 135 445 
             C 175 440, 195 385, 165 320 Z" fill="url(#hairPink)" />

    <path d="M 145 315 
             C 95 340, 95 425, 148 442 
             C 180 452, 185 400, 165 340 Z" fill="url(#hairPurple)" />

    <path d="M 135 320 C 110 355, 118 405, 152 420 C 165 390, 160 350, 135 320 Z" fill="url(#hairBlue)" />

    <!-- Under-belly Tail/Mane Peek -->
    <path d="M 255 415 Q 275 465 310 455 Q 295 435 285 410 Z" fill="url(#hairYellow)" />
    <path d="M 248 420 Q 268 455 292 448 Q 280 428 265 412 Z" fill="url(#hairPurple)" />
  </g>

  <!-- ================= FLOWING RAINBOW TAIL ================= -->
  <g id="tail" class="tail" filter="url(#softShadow)">
    <!-- Bottom Warm Curls (Yellow / Orange / Pink) -->
    <path d="M 355 330 
             C 375 415, 380 515, 465 518 
             C 510 520, 540 490, 520 462 
             C 515 485, 485 495, 455 482 
             C 495 490, 528 465, 518 440 
             C 502 465, 465 470, 435 445 
             C 405 415, 395 365, 355 330 Z" fill="url(#hairYellow)" />

    <!-- Mid Pink & Purple Wave -->
    <path d="M 348 320 
             C 395 275, 465 295, 480 375 
             C 495 450, 440 495, 495 495 
             C 440 508, 385 465, 375 385 
             C 368 350, 358 335, 348 320 Z" fill="url(#hairPink)" />

    <path d="M 348 322 
             C 385 295, 442 320, 452 390 
             C 462 455, 510 475, 538 445 
             C 525 485, 455 488, 415 435 
             C 385 395, 378 345, 348 322 Z" fill="url(#hairPurple)" />

    <!-- Upper Cyan & Yellow Arch -->
    <path d="M 345 312 
             C 385 255, 485 255, 515 330 
             C 535 380, 495 435, 535 422 
             C 552 415, 545 462, 495 462 
             C 445 462, 442 395, 430 355 
             C 415 310, 375 305, 345 312 Z" fill="url(#hairBlue)" />

    <path d="M 350 302 
             C 395 245, 495 252, 518 328 
             C 528 362, 515 395, 498 405 
             C 510 375, 502 332, 472 308 
             C 435 278, 385 282, 350 302 Z" fill="url(#hairYellow)" />
  </g>

  <!-- ================= BACK LEGS ================= -->
  <g id="back-legs" filter="url(#softShadow)">
    <!-- Back Left Leg (Inner/Far) -->
    <path d="M 275 405 L 278 495 L 332 495 L 328 415 Z" fill="url(#whiteShadow)" />
    <!-- Pink Hoof -->
    <path d="M 268 510 C 268 480, 282 475, 302 475 C 322 475, 332 485, 332 510 C 332 520, 268 520, 268 510 Z" fill="url(#hoofPink)" />
    <!-- Fetlock Fur Zigzag -->
    <path d="M 275 485 L 285 468 L 295 488 L 308 480 L 315 492 L 328 482 L 332 495 Q 302 485 275 485 Z" fill="url(#whiteShadow)" />

    <!-- Back Right Leg & Haunch (Viewer's Right) -->
    <path d="M 295 315 
             C 345 305, 375 340, 360 395 
             C 352 422, 375 435, 385 465 
             L 392 505 L 332 505 
             C 332 465, 338 438, 322 425 
             C 295 405, 285 360, 295 315 Z" fill="url(#whiteBody)" />
    <!-- Pink Hoof -->
    <path d="M 328 522 C 328 492, 342 485, 362 485 C 382 485, 394 495, 394 522 C 394 532, 328 532, 328 522 Z" fill="url(#hoofPink)" />
    <!-- Fetlock Fur Zigzag -->
    <path d="M 332 498 L 342 480 L 352 496 L 368 490 L 378 502 L 386 492 L 392 504 Q 362 492 332 498 Z" fill="url(#whiteBody)" />

    <!-- Cutie Mark (Pastel Hearts & Confetti on Flank) -->
    <g id="cutie-mark" opacity="0.9">
      <!-- Yellow Hearts -->
      <path d="M 332 342 C 328 336, 320 340, 325 348 L 334 355 L 342 346 C 346 338, 336 336, 332 342 Z" fill="#fcd34d" />
      <path d="M 315 362 C 312 356, 304 360, 308 368 L 316 375 L 324 366 C 328 358, 318 356, 315 362 Z" fill="#fbbf24" />
      <path d="M 340 368 C 337 363, 330 366, 334 373 L 341 379 L 348 371 C 351 365, 343 363, 340 368 Z" fill="#fcd34d" />
      <!-- Blue & Pink Dots/Confetti -->
      <circle cx="316" cy="342" r="5" fill="#7dd3fc" />
      <circle cx="328" cy="388" r="5.5" fill="#60a5fa" />
      <circle cx="348" cy="356" r="4" fill="#f472b6" />
      <circle cx="305" cy="348" r="3" fill="#fde047" />
      <circle cx="325" cy="358" r="3" fill="#a7f3d0" />
      <circle cx="318" cy="382" r="3.5" fill="#facc15" />
      <circle cx="345" cy="384" r="3" fill="#f9a8d4" />
      <circle cx="326" cy="400" r="3.5" fill="#fbcfe8" />
    </g>
  </g>

  <!-- ================= TORSO & FRONT LEGS ================= -->
  <g id="torso-and-front-legs" class="body" filter="url(#softShadow)">
    <!-- Chest & Belly -->
    <path d="M 178 295 
             C 150 345, 152 405, 185 425 
             C 225 445, 295 430, 325 405 
             L 320 315 
             C 285 325, 255 315, 240 285 Z" fill="url(#whiteBody)" />

    <!-- Front Right Leg (Viewer's Left) -->
    <path d="M 168 395 L 165 502 L 218 502 L 222 415 Z" fill="url(#whiteBody)" />
    <!-- Pink Hoof -->
    <path d="M 160 518 C 160 488, 175 480, 195 480 C 215 480, 222 492, 222 518 C 222 528, 160 528, 160 518 Z" fill="url(#hoofPink)" />
    <!-- Fetlock Fur -->
    <path d="M 164 494 L 175 475 L 188 492 L 202 486 L 210 498 L 218 490 L 220 502 Q 192 488 164 494 Z" fill="url(#whiteBody)" />

    <!-- Front Left Leg (Viewer's Forefront) -->
    <path d="M 198 395 L 208 512 L 268 512 L 260 405 Z" fill="url(#whiteBody)" />
    <!-- Pink Hoof -->
    <path d="M 206 528 C 206 498, 220 490, 240 490 C 260 490, 272 500, 272 528 C 272 540, 206 540, 206 528 Z" fill="url(#hoofPink)" />
    <!-- Fetlock Fur -->
    <path d="M 208 504 L 218 486 L 232 502 L 246 495 L 256 508 L 264 492 L 270 508 Q 240 495 208 504 Z" fill="url(#whiteBody)" />
  </g>

  <!-- ================= HEAD & NECK MANE ================= -->
  <g id="head-and-mane" class="head" filter="url(#softShadow)">
    <!-- Side Mane Curls (Left of Face) -->
    <path d="M 165 165 
             C 95 160, 72 225, 115 268 
             C 75 295, 95 340, 68 312 
             C 62 342, 108 365, 145 342 
             C 115 368, 148 392, 178 352 
             L 185 215 Z" fill="url(#hairYellow)" />

    <path d="M 158 188 
             C 105 202, 92 255, 128 292 
             C 102 315, 125 352, 162 335 
             C 138 295, 145 245, 172 212 Z" fill="url(#hairBlue)" />

    <path d="M 162 210 
             C 122 225, 118 278, 148 310 
             C 128 332, 148 355, 175 338 
             C 155 305, 152 255, 178 225 Z" fill="url(#hairYellow)" />

    <!-- Top Left Cyan & Pink Swirl (Behind Left Ear) -->
    <path d="M 158 168 
             C 102 185, 62 145, 92 108 
             C 78 135, 105 155, 132 135 
             C 112 152, 135 170, 158 168 Z" fill="url(#hairYellow)" />
    <path d="M 165 158 
             C 110 165, 88 105, 138 75 
             C 122 98, 135 115, 158 102 
             C 182 88, 195 125, 165 158 Z" fill="url(#hairBlue)" />

    <!-- Right Side Mane Curls (Behind Cheek) -->
    <path d="M 320 215 
             C 365 235, 368 295, 332 322 
             C 305 340, 275 330, 265 315 Z" fill="url(#hairYellow)" />
    <path d="M 315 240 C 345 260, 345 305, 315 322 C 292 332, 272 325, 265 310 Z" fill="url(#hairBlue)" />
    <path d="M 242 300 C 235 330, 255 362, 285 342 C 265 345, 258 325, 265 305 Z" fill="url(#hairPurple)" />
    <path d="M 325 215 C 342 255, 378 265, 388 232 C 392 268, 355 282, 322 248 Z" fill="url(#hairPink)" />

    <!-- Right Ear (Viewer's Right) -->
    <path d="M 325 142 C 348 112, 372 98, 380 105 C 386 112, 375 155, 355 182 Z" fill="url(#whiteBody)" />
    <path d="M 335 148 C 352 122, 368 112, 374 118 C 378 124, 368 155, 352 175 Z" fill="url(#earPink)" />

    <!-- Base Head Shape -->
    <path d="M 178 162 
             C 155 195, 145 255, 155 282 
             C 165 310, 212 322, 250 320 
             C 292 318, 328 295, 330 262 
             C 332 232, 322 185, 295 162 
             C 265 138, 205 138, 178 162 Z" fill="url(#headWhite)" />

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="182" cy="265" rx="28" ry="18" fill="url(#cheekBlush)" />
    <ellipse cx="296" cy="274" rx="24" ry="16" fill="url(#cheekBlush)" />

    <!-- ================= EYES ================= -->
    <!-- Left Eye (Viewer's Left) -->
    <g id="left-eye" class="eyes">
      <!-- Eyelashes & Upper Lid -->
      <path d="M 162 205 L 152 195 M 168 196 L 160 184 M 176 190 L 172 178 M 186 186 L 185 175" stroke="#181824" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 162 212 C 165 185, 198 182, 212 205 C 220 220, 215 248, 198 254 C 178 260, 160 238, 162 212 Z" fill="#181824" />
      <!-- Sclera -->
      <path d="M 166 216 C 168 192, 196 190, 208 208 C 215 222, 212 246, 196 251 C 180 256, 165 238, 166 216 Z" fill="#ffffff" />
      <!-- Blue Iris -->
      <ellipse cx="192" cy="224" rx="18" ry="23" fill="url(#eyeBlue)" />
      <!-- Pupil -->
      <ellipse cx="193" cy="222" rx="12" ry="16" fill="#0f141c" />
      <!-- Catchlights -->
      <circle cx="184" cy="210" r="6" fill="#ffffff" />
      <circle cx="200" cy="234" r="3" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Right Eye (Viewer's Right) -->
    <g id="right-eye" class="eyes">
      <!-- Eyelashes & Upper Lid -->
      <path d="M 318 228 L 328 222 M 314 220 L 324 210 M 308 212 L 316 202" stroke="#181824" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 268 238 C 272 210, 305 202, 316 225 C 322 240, 312 262, 292 265 C 272 268, 265 252, 268 238 Z" fill="#181824" />
      <!-- Sclera -->
      <path d="M 271 240 C 275 215, 302 208, 312 228 C 318 242, 308 260, 290 262 C 274 264, 268 252, 271 240 Z" fill="#ffffff" />
      <!-- Blue Iris -->
      <ellipse cx="291" cy="238" rx="17" ry="20" transform="rotate(10 291 238)" fill="url(#eyeBlue)" />
      <!-- Pupil -->
      <ellipse cx="290" cy="236" rx="11" ry="14" transform="rotate(10 290 236)" fill="#0f141c" />
      <!-- Catchlights -->
      <circle cx="284" cy="226" r="5" fill="#ffffff" />
      <circle cx="296" cy="242" r="2.5" fill="#ffffff" opacity="0.9" />
      <circle cx="302" cy="236" r="1.8" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Eyebrows -->
    <path d="M 178 175 Q 192 166 206 175" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 285 186 Q 302 180 314 192" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

    <!-- ================= SNOUT & SMILE ================= -->
    <g id="snout">
      <!-- Plump Rounded Muzzle -->
      <ellipse cx="242" cy="272" rx="34" ry="24" transform="rotate(5 242 272)" fill="url(#headWhite)" />
      <!-- Smile Line -->
      <path d="M 208 268 Q 222 296 254 294 Q 268 292 274 282" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 204 265 Q 209 268 211 273" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      <!-- Pinkish Nostrils -->
      <path d="M 225 256 Q 230 260 230 266" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 262 262 Q 258 266 256 271" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- ================= FOREHEAD BANGS, HORN & LEFT EAR ================= -->
    <!-- Top Crown Rainbow Arch -->
    <path d="M 205 110 C 235 65, 310 72, 325 125 L 220 140 Z" fill="url(#hairPink)" />
    <path d="M 210 118 C 245 82, 315 88, 332 138 L 220 145 Z" fill="url(#hairYellow)" />
    <path d="M 208 128 C 245 98, 308 105, 325 148 L 215 155 Z" fill="url(#hairBlue)" />

    <!-- Right Swept Golden-Orange Bangs -->
    <path d="M 285 115 
             C 335 115, 385 155, 362 205 
             C 348 232, 315 225, 320 202 
             C 328 212, 342 202, 338 182 
             C 332 158, 295 148, 275 140 Z" fill="url(#hairYellow)" />
    <!-- Cyan Highlight Lock Next to Horn -->
    <path d="M 295 135 C 318 140, 322 162, 332 162 C 318 175, 298 165, 292 145 Z" fill="url(#hairBlue)" />

    <!-- Center Dramatic Pink & Purple Forelock Swoop -->
    <path d="M 212 125 
             C 198 158, 205 205, 226 232 
             C 232 195, 232 155, 212 125 Z" fill="url(#hairPurple)" />
    <path d="M 218 122 
             C 255 118, 288 155, 265 205 
             C 252 232, 232 232, 226 232 
             C 235 195, 220 162, 205 145 
             C 208 132, 212 125, 218 122 Z" fill="url(#hairPink)" />
    <!-- Soft Yellow Highlight on Forelock -->
    <path d="M 232 125 C 252 135, 258 162, 248 188 C 245 162, 238 142, 222 130 Z" fill="url(#hairYellow)" opacity="0.75" />

    <!-- Spiraled Golden Unicorn Horn -->
    <g id="horn">
      <!-- Base Segment -->
      <path d="M 262 138 C 260 155, 278 165, 292 152 C 298 145, 298 135, 290 128 Z" fill="url(#goldHorn)" />
      <!-- Mid Segment 1 -->
      <path d="M 270 124 C 266 138, 285 146, 298 135 C 304 128, 302 118, 294 112 Z" fill="url(#goldHorn)" />
      <!-- Mid Segment 2 -->
      <path d="M 280 110 C 276 122, 292 128, 304 118 C 310 112, 308 104, 300 98 Z" fill="url(#goldHorn)" />
      <!-- Pointed Tip -->
      <path d="M 290 98 C 288 108, 300 112, 308 104 L 318 85 C 320 80, 314 76, 308 80 Z" fill="url(#goldHorn)" />
      <!-- Spiral Crease Lines -->
      <path d="M 265 142 Q 278 152 294 142 M 274 126 Q 286 135 300 125 M 284 112 Q 294 118 305 110" fill="none" stroke="#8c4608" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Left Ear (Viewer's Forefront Left) -->
    <g id="left-ear" class="ear-left">
      <path d="M 168 165 
               C 145 135, 152 75, 185 55 
               C 212 75, 222 130, 198 165 
               C 188 175, 175 175, 168 165 Z" fill="url(#whiteBody)" />
      <path d="M 174 155 
               C 160 130, 165 85, 185 68 
               C 202 85, 208 128, 192 155 
               C 186 164, 178 164, 174 155 Z" fill="url(#earPink)" />
      <!-- Cute Inner Ear Bump -->
      <circle cx="182" cy="122" r="11" fill="#ffabc8" opacity="0.75" />
    </g>
  </g>
</svg>