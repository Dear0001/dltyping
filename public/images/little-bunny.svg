<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="little-bunny">
    <!-- Tail -->
    <circle class="tail" cx="75" cy="75" r="9" fill="#f0f0f0" />
    
    <!-- Body -->
    <circle class="body" cx="50" cy="70" r="22" fill="#ffffff" />
    
    <!-- Head -->
    <g class="head">
      <!-- Ears -->
      <g class="ear-left">
        <ellipse cx="38" cy="25" rx="7" ry="22" fill="#ffffff" />
        <ellipse cx="38" cy="27" rx="3.5" ry="14" fill="#ffb6c1" />
      </g>
      <g class="ear-right">
        <ellipse cx="62" cy="25" rx="7" ry="22" fill="#ffffff" />
        <ellipse cx="62" cy="27" rx="3.5" ry="14" fill="#ffb6c1" />
      </g>
      
      <!-- Face -->
      <circle cx="50" cy="50" r="20" fill="#ffffff" />
      <circle class="blush-left" cx="35" cy="53" r="4" fill="#ffe4e1" />
      <circle class="blush-right" cx="65" cy="53" r="4" fill="#ffe4e1" />
      
      <!-- Eyes & Nose -->
      <g class="eyes">
        <circle cx="41" cy="47" r="3" fill="#111111" />
        <circle cx="59" cy="47" r="3" fill="#111111" />
      </g>
      <path class="nose" d="M 48 53 Q 50 55 52 53" stroke="#ffb6c1" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>