<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g class="baby-dragon">
    <!-- Tail -->
    <path class="tail" d="M 65 70 Q 85 85 90 65 L 82 65 Z" fill="#2a9d8f" />
    
    <!-- Wings -->
    <path class="wing-left" d="M 30 50 Q 5 35 15 20 Q 25 35 40 45" fill="#a8dadc" />
    <path class="wing-right" d="M 70 50 Q 95 35 85 20 Q 75 35 60 45" fill="#a8dadc" />
    
    <!-- Body -->
    <ellipse class="body" cx="50" cy="65" rx="20" ry="24" fill="#2a9d8f" />
    <ellipse class="belly" cx="50" cy="68" rx="14" ry="18" fill="#e9c46a" />
    
    <!-- Head -->
    <g class="head">
      <!-- Horns -->
      <polygon class="horn-left" points="30,22 40,28 35,35" fill="#e9c46a" />
      <polygon class="horn-right" points="70,22 60,28 65,35" fill="#e9c46a" />
      
      <!-- Face -->
      <circle cx="50" cy="40" r="20" fill="#2a9d8f" />
      
      <!-- Eyes -->
      <g class="eyes">
        <ellipse cx="40" cy="38" rx="3.5" ry="5" fill="#264653" />
        <circle cx="40" cy="36" r="1.5" fill="#ffffff" />
        <ellipse cx="60" cy="38" rx="3.5" ry="5" fill="#264653" />
        <circle cx="60" cy="36" r="1.5" fill="#ffffff" />
      </g>
      
      <!-- Snout/Smile -->
      <path class="snout" d="M 40 48 Q 50 55 60 48" stroke="#264653" stroke-width="2" fill="none" stroke-linecap="round" />
      <circle cx="45" cy="45" r="1" fill="#264653" />
      <circle cx="55" cy="45" r="1" fill="#264653" />
    </g>
  </g>
</svg>