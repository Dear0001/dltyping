    <path class="body" d="M 50 12 C 70 12 80 42 80 64 C 80 82 67 92 50 92 C 33 92 20 82 20 64 C 20 42 30 12 50 12 Z" fill="#fff7e6" stroke="#f0d9b5" stroke-width="2" />
    <!-- Spots -->
    <g class="spots">
      <circle cx="38" cy="32" r="5" fill="#38bdf8" />
      <circle cx="62" cy="40" r="4" fill="#2563eb" />
      <circle cx="54" cy="24" r="3" fill="#38bdf8" />
      <circle cx="68" cy="58" r="3.5" fill="#38bdf8" />
    </g>
    <!-- Face -->
    <g class="head">
      <g class="eyes">
        <circle cx="40" cy="62" r="3.5" fill="#14213d" />
        <circle cx="39" cy="61" r="1" fill="#ffffff" />
        <circle cx="60" cy="62" r="3.5" fill="#14213d" />
        <circle cx="59" cy="61" r="1" fill="#ffffff" />
      </g>
      <circle class="blush-left" cx="33" cy="70" r="4" fill="#ffd1dc" />
      <circle class="blush-right" cx="67" cy="70" r="4" fill="#ffd1dc" />
      <path class="mouth" d="M 45 70 Q 50 75 55 70" stroke="#14213d" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
